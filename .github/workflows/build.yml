          cat > 'src/main/java/dev/legavisual/mixin/PressableWidgetMixin.java' <<'LEGA_EOF'
          package dev.legavisual.mixin;

          import dev.legavisual.GuiUtil;
          import dev.legavisual.LegaConfig;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.widget.PressableWidget;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(PressableWidget.class)
          public abstract class PressableWidgetMixin {
              @Inject(method = "renderWidget", at = @At("HEAD"), cancellable = true, require = 0)
              private void legavisual$glass(DrawContext ctx, int mouseX, int mouseY, float delta, CallbackInfo ci) {
                  if (!LegaConfig.glassButtons) {
                      return;
                  }
                  PressableWidget w = (PressableWidget) (Object) this;
                  int x = w.getX();
                  int y = w.getY();
                  int ww = w.getWidth();
                  int h = w.getHeight();
                  boolean hov = w.isHovered() && w.active;
                  int tint = LegaConfig.accent() & 0x00FFFFFF;
                  GuiUtil.roundRect(ctx, x, y, ww, h, 5, hov ? (0xDD000000 | tint) : (0x66000000 | tint));
                  GuiUtil.roundRect(ctx, x + 1, y + 1, ww - 2, h - 2, 4, hov ? 0xCC2E2256 : 0xAA1C1636);
                  ctx.fill(x + 5, y + 1, x + ww - 5, y + 2, 0x44FFFFFF);
                  ctx.drawCenteredTextWithShadow(MinecraftClient.getInstance().textRenderer, w.getMessage(),
                          x + ww / 2, y + (h - 8) / 2, w.active ? 0xFFFFFFFF : 0xFF8A8AA0);
                  ci.cancel();
              }
          }
